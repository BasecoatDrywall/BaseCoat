<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basecoat</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f4f6;color:#15171b}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#111827,#263143)}.box{width:min(410px,92vw);background:white;padding:30px;border-radius:22px;box-shadow:0 25px 80px #0005}.logo{font-size:34px;font-weight:900}.muted{color:#737a86}.input,button{width:100%;padding:12px;border-radius:11px;margin:6px 0;border:1px solid #ddd;font:inherit}.btn{background:#111827;color:#fff;font-weight:800;cursor:pointer}.light{background:#eef0f3;color:#111827}.app{display:flex;min-height:100vh}.side{width:230px;background:#111827;color:#fff;padding:20px;position:fixed;height:100vh}.brand{font-size:25px;font-weight:900;margin-bottom:25px}.side button{background:none;color:#bbc2ce;border:0;text-align:left;cursor:pointer}.side button:hover{color:white}.main{margin-left:230px;padding:28px;width:calc(100% - 230px);max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:28px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 3px 14px #00000009}.metric{font-size:27px;font-weight:900;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{border:1px solid #e7e8eb;border-radius:13px;padding:13px;margin:10px 0}.bar{height:9px;background:#e6e8ec;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#111827}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo{height:110px;background:#e0e3e7;border-radius:12px;display:grid;place-items:center;color:#666;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.chat{max-height:330px;overflow:auto;display:grid;gap:8px}.msg{padding:10px 12px;background:#eef0f3;border-radius:13px;max-width:75%}.mine{margin-left:auto;background:#111827;color:white}.canvasbox{height:520px;border:1px solid #ddd;border-radius:14px;background:white;overflow:hidden;position:relative}.canvasbox canvas{width:100%;height:100%;touch-action:none}.originMarker{position:absolute;width:18px;height:18px;border:2px solid #d33;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;color:#d33;font-size:10px;text-align:center;background:#fff9}.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tools button{width:auto;min-width:76px;margin:0;padding:9px 12px;cursor:pointer}.tools .selected{background:#111827;color:#fff}.job-actions{display:flex;gap:8px;margin-top:12px}.job-actions button{width:auto;flex:1}.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolrow select,.toolrow input{padding:9px;border:1px solid #d7dbe1;border-radius:9px}.@media(max-width:800px){.side{width:65px}.brand{font-size:0}.brand:before{content:"B";font-size:25px}.side button{font-size:0}.side button:first-letter{font-size:20px}.main{margin-left:65px;width:calc(100% - 65px);padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.main{padding:10px}.title{font-size:22px}}
</style></head><body><div id="root"></div><script>
let me=null,jobs=[],page="dashboard",activeJob=null,selectedWorkerId=null,msgTimer=null,activeGroupId=null,priceJobId=null,priceRequestId=null,priceRequestNote="",pricingSettings={},pricingTypes=[],pricingWorkers=[],priceQuoteTouched=false,paymentConfig={},locationWatch=null,lastLocationSent=0,sharingRequested=false;
const $=x=>document.querySelector(x);
function esc(v){let d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML}
async function api(url,opt={}){let r=await fetch(url,{credentials:"same-origin",...opt});let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
function login(){root.innerHTML=`<div class=login><div class=box><div class=logo>BASECOAT</div><p class=muted>Construction management, built for the field.</p><p class=muted>Sign in with your Basecoat account or use Google.</p><a class=btn style="display:block;text-align:center;text-decoration:none;padding:12px" href="/auth/google?role=customer">Continue with Google · Customer</a><a class=light style="display:block;text-align:center;text-decoration:none;padding:12px;border-radius:11px" href="/auth/google?role=worker">Apply with Google · Worker</a><small class=muted>Worker applications need owner approval before access to jobs, pay, or team chats.</small><hr><input id=e class=input autocomplete=email placeholder=Email><input id=p class=input type=password autocomplete=current-password placeholder=Password><button class=btn onclick=doLogin()>Sign in</button><div id=googleSetup class=muted style="font-size:12px"></div></div></div>`;api("/api/public-config").then(c=>{if(!c.google_enabled)$("#googleSetup").textContent="Google sign-in requires the app owner to finish secure Google setup."}).catch(()=>{})}
function fill(e,p){$("#e").value=e;$("#p").value=p}
async function doLogin(){try{me=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#e").value,password:$("#p").value})});if(me.role==="worker"&&me.approval_status!=="approved"){render();return}page=me.role==="customer"?"home":me.role==="worker"?"home":"dashboard";await refresh();render()}catch(e){alert(e.message)}}
async function refresh(){jobs=(await api("/api/jobs")).jobs;if(!activeJob||!jobs.some(j=>j.id===activeJob))activeJob=jobs[0]?.id||null}
function nav(p){page=p;render()}
function shell(){if(me.role==="worker"&&me.approval_status!=="approved")return `<div class=login><div class=box><div class=logo>BASECOAT</div><h2>Application awaiting review</h2><p class=muted>Your worker account is pending owner approval. You cannot access jobs, time clock, pay information, or team chats until approved.</p><p>${esc(me.email)}</p><button class=light onclick="logout()">Sign out</button></div></div>`;return `<div class=app><aside class=side><div class=brand>BASECOAT</div><button onclick="nav('dashboard')">▦ Dashboard</button><button onclick="nav('jobs')">▣ Jobs</button>${me.role==="owner"?`<button onclick="nav('workers')">♙ Workers</button><button onclick="nav('accounts')">♙ Accounts</button><button onclick="nav('tracking')">◎ Shift Tracking</button><button onclick="nav('ranks')">☆ Ranks</button><button onclick="nav('customers')">◎ Customers</button><button onclick="nav('blacklist')">⛔ Request block list</button><button onclick="nav('requests')">▣ Job requests</button><button onclick="nav('pricing-settings')">$ Pricing settings</button>`:""}${(me.role==="owner"||me.role==="worker")?`<button onclick="nav('messages')">☏ Messages</button><button onclick="nav('groups')">👥 Team chats</button>${me.can_inspect?`<button onclick="nav('inspections')">✓ Inspections</button>`:""}${me.role==="worker"&&me.can_manage?`<button onclick="nav('requests')">▣ Job requests</button>`:""}`:`<button onclick="nav('requests')">▣ Request a Job</button>`}${me.role!=="customer"?`<button onclick="nav('blueprint')">⌗ Blueprint</button>`:""}<button onclick="nav('password')">Change password</button><button onclick="nav('terms')">Terms of Service</button>${me.role==="owner"||me.role==="customer"?`<button onclick="nav('payments')">＄ Payments</button>`:""}<button onclick="logout()">↪ Sign out</button></aside><main class=main><div class=top><div><div class=title>${title()}</div><div class=muted>${me.name} · ${me.rank||me.role}</div></div><b>BASECOAT</b></div><div style="margin-top:18px">${content()}</div></main></div>`}
function title(){return ({accounts:"Accounts",dashboard:"Owner Dashboard",jobs:"Jobs",workers:"Workers",tracking:"Shift Tracking",ranks:"Manage Ranks",customers:"Customers",messages:"Messages",groups:"Team Chats",requests:"Job Requests",blacklist:"Request Block List",inspections:"Job Inspections",terms:"Terms of Service Draft",blueprint:"Blueprint Studio",payroll:"Worker Pay",price:"Job Price Calculator","pricing-settings":"Pricing Settings",payments:"Payments",home:me.role==="worker"?"My Day":"My Project"})[page]||"Basecoat"}
function content(){if(page==="accounts")return accountsView();if(page==="tracking")return `<div class=card><div class=row><div><h3>Workers currently clocked in</h3><p class=muted>Location is shared only when a worker opts in while clocked in. Updates stop when the worker clocks out; stale readings are labeled.</p></div><button class=light style="width:auto" onclick="loadTracking()">Refresh</button></div><div id=trackingRows>Loading…</div></div>`;if(page==="password")return passwordView();if(page==="dashboard")return dashboard();if(page==="jobs")return jobsView();if(page==="workers")return `<div class=card><div class=row><div><h3>Workers and Pay</h3><p class=muted>Manage rank, employment status, and pay.</p></div><button class=light style="width:auto" onclick="nav('ranks')">Manage ranks</button></div><div id=workers>Loading...</div></div>`;if(page==="ranks")return ranksView();if(page==="payroll")return payrollView();if(page==="customers")return `<div class=card><h3>Customers</h3><div id=customers>Loading...</div></div>`;if(page==="messages")return messages();if(page==="groups")return groupsView();if(page==="requests")return requestsView();if(page==="blacklist")return `<div class=card><h3>Block new job requests</h3><p class=muted>This prevents new requests through this demo. It does not erase customer records or decide legal liability.</p><div class=toolrow><input id=blEmail class=input placeholder="Customer account email"><input id=blReason class=input placeholder="Documented reason"><button class=btn style="width:auto" onclick="addBlacklist()">Add to block list</button></div><div id=blacklistRows>Loading...</div></div>`;if(page==="inspections")return inspectionsView();if(page==="terms")return termsView();if(page==="price")return priceView();if(page==="pricing-settings")return pricingSettingsView();if(page==="blueprint")return blueprint();if(page==="payments")return payments();return me.role==="worker"?worker():customer()}
function dashboard(){return `<div class=grid><div class=card><div class=muted>Revenue</div><div class=metric>$8,420</div></div><div class=card><div class=muted>Active Jobs</div><div class=metric>${jobs.filter(j=>j.status!=="Complete").length}</div></div><div class=card><div class=muted>Workers</div><div class=metric>8</div></div><div class=card><div class=muted>Estimates</div><div class=metric>3</div></div></div><div class=cards><div class=card><h3>Active Jobs</h3>${jobs.slice(0,3).map(j=>jc(j)).join("")}</div><div class=card><h3>Quick Actions</h3><button class=btn onclick="newJob()">+ New Job</button><button class=light onclick="nav('blueprint')">Blueprint Studio</button><button class=light onclick="nav('messages')">Crew Messages</button></div></div>`}
function jc(j){return `<div class=item><div class=row><b>${j.name}</b><b>${j.progress}%</b></div><div class=muted>${j.type||"Job"} · ${j.worker||"Unassigned"}</div><div class=bar><i style="width:${j.progress}%"></i></div></div>`}
function newJob(){priceJobId=null;priceRequestId=null;page="price";render()}
function openPriceCalculator(id){priceJobId=id;priceRequestId=null;page="price";render()}
function openRequestPricing(id,note=""){priceJobId=null;priceRequestId=id;priceRequestNote=note;page="price";render()}
function openBlueprint(id){activeJob=id;page="blueprint";render()}
function jobCard(j){let controls=me.role==="owner"?`<button class=light onclick="updateProgress(${j.id},${j.progress||0})">Update progress</button><button class=light onclick="editJob(${j.id})">Edit details</button><button class=light onclick="openPriceCalculator(${j.id})">Recalculate price</button><button class=light onclick="setJobBoundary(${j.id})">Set site boundary · 500 ft</button><button class="light danger" onclick="deleteJob(${j.id})">Delete job</button>`:"";let priceInfo=j.pricing_complete?`<div class=muted>Estimated materials $${Number(j.material_cost||0).toFixed(2)} · worker pay $${Number(j.labor_cost||0).toFixed(2)} · other costs $${Number(j.additional_costs||0).toFixed(2)} · planned profit $${Math.max(0,Number(j.total||0)-Number(j.material_cost||0)-Number(j.labor_cost||0)-Number(j.additional_costs||0)).toFixed(2)}</div>`:`<div class=muted>Price breakdown not set yet. Owner can recalculate this job.</div>`;return `<div class=card>${jc(j)}<div class=muted>${j.status||"New"} · ${j.address||"No address added"} · $${Number(j.total||0).toLocaleString()}</div>${priceInfo}<div class=photo-grid style="margin-top:10px">${j.blueprint_url?`<div class=photo><img src="${esc(j.blueprint_url)}" alt="Saved blueprint for ${esc(j.name)}"></div>`:`<div class=photo>Blueprint not saved</div>`}<div class=photo>Progress</div><div class=photo>After</div></div><div class=job-actions><button class=btn onclick="openBlueprint(${j.id})">⌗ Blueprint</button>${me.role==="owner"||me.can_inspect?`<button class=light onclick="openInspection(${j.id})">Inspection report</button>`:""}${controls}</div></div>`}
async function updateProgress(id,current){let v=prompt("Job progress (0–100%)",String(current));if(v===null)return;let progress=Math.max(0,Math.min(100,Number(v)||0));await api("/api/jobs/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({progress,status:progress===100?"Complete":"In Progress"})});await refresh();render()}
async function editJob(id){let j=jobs.find(x=>x.id===id);if(!j)return;let name=prompt("Job/customer name",j.name);if(name===null)return;let type=prompt("Work type",j.type||"");if(type===null)return;let address=prompt("Job address",j.address||"");if(address===null)return;let status=prompt("Status (New, Scheduled, In Progress, Complete)",j.status||"New");if(status===null)return;let customer_email=prompt("Customer account email for portal and messages (leave blank to unlink)",j.customer_email||"");if(customer_email===null)return;try{await api("/api/jobs/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,type,address,status,customer_email})});await refresh();render()}catch(e){alert(e.message)}}
async function deleteJob(id){let j=jobs.find(x=>x.id===id);if(!j||!confirm("Delete "+j.name+" and its job messages, photos, invoice, and blueprints? This cannot be undone."))return;try{await api("/api/jobs/"+id,{method:"DELETE"});if(activeJob===id)activeJob=null;await refresh();render()}catch(e){alert(e.message)}}
async function openPayroll(id){selectedWorkerId=id;page="payroll";render()}
function backWorkers(){nav("workers")}
function payrollView(){return `<div class=card><div class=row><div><h3>Worker Pay</h3><p class=muted>Hourly rate, completed clock hours, and pending adjustments.</p></div><button class=light style="width:auto" onclick=backWorkers()>Back to workers</button></div><div id=payrollbody>Loading pay details...</div><p class=muted>This local demo records estimates and adjustments only. It does not transfer money or run payroll.</p></div>`}
async function saveWorkerRate(){let rate=Number($("#payrate").value);try{await api("/api/workers/"+selectedWorkerId,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({rate})});await loadPayroll()}catch(e){alert(e.message)}}
async function addPayAdjustment(){let kind=$("#adjustkind").value,amount=Number($("#adjustamount").value),reason=$("#adjustreason").value.trim(),authorized=$("#payauthorized").checked;try{await api("/api/payroll/"+selectedWorkerId+"/adjustments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,amount,reason,authorized})});await loadPayroll()}catch(e){alert(e.message)}}
async function loadPayroll(){let d=await api("/api/payroll/"+selectedWorkerId),w=d.worker;let hist=d.adjustments.map(a=>`<div class=item><b>${a.kind==="deduction"?"Deduction":"Bonus"}: $${Number(a.amount).toFixed(2)}</b> · ${a.reason}<br><span class=muted>${a.status} · ${new Date(a.created_at+"Z").toLocaleString()}${a.authorized?" · authorization documented":""}</span></div>`).join("")||"<p class=muted>No pay adjustments recorded.</p>";$("#payrollbody").innerHTML=`<div class=grid><div class=card><div class=muted>Completed hours logged</div><div class=metric>${d.hours}</div></div><div class=card><div class=muted>Gross estimate (${d.hours}h × rate)</div><div class=metric>$${d.gross.toFixed(2)}</div></div><div class=card><div class=muted>Pending deductions</div><div class=metric>−$${d.deductions.toFixed(2)}</div></div><div class=card><div class=muted>Estimated pay after adjustments</div><div class=metric>$${d.net_estimate.toFixed(2)}</div></div></div><div class=card><h3>${w.name} · Hourly rate</h3><div class=row><input class=input id=payrate type=number min=0 step=0.01 value="${Number(w.rate).toFixed(2)}"><button class=btn style="max-width:200px" onclick=saveWorkerRate()>Save hourly rate</button></div></div><div class=card><h3>Record a pay adjustment</h3><div class=toolrow><select id=adjustkind><option value=deduction>Deduction</option><option value=bonus>Bonus</option></select><input class=input id=adjustamount type=number min=0.01 step=0.01 placeholder="Amount"><input class=input id=adjustreason placeholder="Reason, for example damaged equipment"></div><label><input id=payauthorized type=checkbox> I have documented authorization for this deduction</label><button class=btn onclick=addPayAdjustment()>Record adjustment</button><p class=muted>Deduction entries require the documented-authorization box. Review applicable payroll rules before applying any deduction.</p></div><div class=card><h3>Adjustment history</h3>${hist}</div>`}
function accountsView(){return `<div class=card><h3>Worker applications</h3><p class=muted>Workers who sign up through Google remain locked out until you approve them and set their starting pay/rank.</p><div id=applications>Loading…</div></div><div class=card><h3>Create an account</h3><p class=muted>Owner-created accounts are active immediately. Share temporary passwords privately.</p><div class=grid><div><label>Account type</label><select id=accountRole class=input><option value=worker>Worker</option><option value=customer>Customer</option></select></div><div><label>Name</label><input id=accountName class=input autocomplete=name></div><div><label>Email</label><input id=accountEmail class=input type=email autocomplete=email></div><div><label>Temporary password (12+ characters)</label><input id=accountPassword class=input type=password autocomplete=new-password></div><div><label>Worker hourly pay</label><input id=accountRate class=input type=number min=0 step=.01 value=22></div><div><label>Worker rank</label><select id=accountRank class=input></select></div></div><button class=btn style="width:auto" onclick=createAccount()>Create account</button><div id=accountResult></div></div><div class=card><h3>Accounts</h3><div id=accountList>Loading…</div></div>`}
async function loadAccounts(){let [d,r,a]=await Promise.all([api("/api/accounts"),api("/api/ranks"),api("/api/worker-applications")]);$("#accountRank").innerHTML=`<option value="">Unranked</option>`+r.ranks.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");$("#accountList").innerHTML=d.accounts.map(x=>`<div class=item><b>${esc(x.name)}</b> · ${esc(x.email)}<br>${esc(x.role)}${x.role==="worker"?` · ${esc(x.approval_status)} · ${esc(x.employment_status)} · $${Number(x.rate||0).toFixed(2)}/hr`:""}</div>`).join("")||"<p class=muted>No accounts yet.</p>";$("#applications").innerHTML=a.applications.map(x=>`<div class=item><b>${esc(x.name)}</b> · ${esc(x.email)}<div class=toolrow><input id="app-rate-${x.id}" class=input type=number min=0 step=.01 value=22 placeholder="Hourly rate"><select id="app-rank-${x.id}" class=input><option value="">Choose rank</option>${r.ranks.map(z=>`<option value="${z.id}">${esc(z.name)}</option>`).join("")}</select><button class=btn style="width:auto" onclick="reviewApplication(${x.id},'approved')">Approve</button><button class=light style="width:auto" onclick="reviewApplication(${x.id},'declined')">Decline</button></div></div>`).join("")||"<p class=muted>No pending worker applications.</p>"}
async function reviewApplication(id,decision){try{await api(`/api/worker-applications/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({decision,rate:$("#app-rate-"+id).value,rank_id:$("#app-rank-"+id).value})});await loadAccounts()}catch(e){alert(e.message)}}
async function createAccount(){try{await api("/api/accounts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role:$("#accountRole").value,name:$("#accountName").value,email:$("#accountEmail").value,password:$("#accountPassword").value,rate:$("#accountRate").value,rank_id:$("#accountRank").value})});$("#accountResult").innerHTML="<p class=muted>Account created. Give the temporary password to the user through a private channel.</p>";$("#accountPassword").value="";await loadAccounts()}catch(e){alert(e.message)}}
function passwordView(){return `<div class=card><h3>Change your password</h3><p class=muted>Choose a unique password with at least 12 characters.</p><input id=currentPassword class=input type=password autocomplete=current-password placeholder="Current password"><input id=newPassword class=input type=password autocomplete=new-password placeholder="New password (12+ characters)"><input id=confirmPassword class=input type=password autocomplete=new-password placeholder="Confirm new password"><button class=btn onclick=savePassword()>Update password</button></div>`}
async function savePassword(){if($("#newPassword").value!==$("#confirmPassword").value){alert("The new passwords do not match.");return}try{await api("/api/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({current_password:$("#currentPassword").value,new_password:$("#newPassword").value})});$("#currentPassword").value="";$("#newPassword").value="";$("#confirmPassword").value="";alert("Password updated.")}catch(e){alert(e.message)}}
function ranksView(){return `<div class=card><h3>Manage crew ranks</h3><p class=muted>Each rank can have its own group chat. Only enable foreman chat management or inspector reporting when you assign those responsibilities.</p><div class=toolrow><input class=input id=newrank placeholder="New rank name"><label><input id=newManage type=checkbox> May manage chat members</label><label><input id=newInspect type=checkbox> May submit inspections</label><button class=btn style="width:auto" onclick=addRank()>Add rank</button></div><div id=ranklist>Loading ranks...</div></div>`}
async function loadRanksPage(){let d=await api("/api/ranks");$("#ranklist").innerHTML=d.ranks.map(r=>`<div class=item><div class=toolrow><input class=input id="rankname-${r.id}" value="${esc(r.name)}"><label><input id="rankmanage-${r.id}" type=checkbox ${r.can_manage_chats?"checked":""}> Manage chat members</label><label><input id="rankinspect-${r.id}" type=checkbox ${r.can_inspect?"checked":""}> Submit inspections</label><button class=btn style="width:auto" onclick="renameRank(${r.id})">Save rank</button><button class="light danger" style="width:auto" onclick="deleteRank(${r.id})">Delete</button></div><small class=muted>Saving rank settings also creates/updates its rank group chat.</small></div>`).join("")||"<p class=muted>No ranks yet. Add a rank above.</p>"}
async function addRank(){let input=$("#newrank"),name=input.value.trim();if(!name)return;try{await api("/api/ranks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,can_manage_chats:$("#newManage").checked,can_inspect:$("#newInspect").checked})});input.value="";await loadRanksPage();alert("Rank saved. Assign it to a worker in Workers.")}catch(e){alert("Rank was not saved: "+e.message)}}
async function renameRank(id){try{await api("/api/ranks/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("#rankname-"+id).value.trim(),can_manage_chats:$("#rankmanage-"+id).checked,can_inspect:$("#rankinspect-"+id).checked})});await loadRanksPage();alert("Rank settings saved.")}catch(e){alert("Rank settings were not saved: "+e.message)}}
async function deleteRank(id){if(!confirm("Delete this rank? Workers assigned to it will become unranked."))return;try{await api("/api/ranks/"+id,{method:"DELETE"});await loadRanksPage()}catch(e){alert(e.message)}}
async function saveWorkerRank(id){try{let rank_id=$("#worker-rank-"+id).value;await api("/api/workers/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({rank_id:rank_id||null})});await postRender();alert("Worker rank saved. Their rank chat access was updated.")}catch(e){alert("Worker rank was not saved: "+e.message)}}
async function changeWorkerStatus(id,status){let action=status==="fired"?"Fire this worker? Their login will be disabled and active jobs unassigned, but pay and work history will be kept.":"Reactivate this worker and restore their login?";if(!confirm(action))return;try{await api("/api/workers/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({employment_status:status})});await refresh();render()}catch(e){alert(e.message)}}function jobsView(){return `<div class=row>${me.role==="owner"?`<button class=btn style="max-width:180px" onclick="newJob()">+ New Job</button>`:""}</div><div class=cards>${jobs.map(jobCard).join("")}</div>`}
function worker(){let j=jobs[0];return `<div class=grid><div class=card><div class=muted>Your rank</div><div class=metric>${esc(me.rank||"Unranked")}</div></div><div class=card><div class=muted>Hourly Rate</div><div class=metric>$${me.rate}/hr</div></div><div class=card><div class=muted>This Week</div><div class=metric>31.5h</div></div><div class=card><div class=muted>Est. Earnings</div><div class=metric>$693</div></div></div><div class=card><h3>Today's Job</h3>${jc(j||{name:"No job",type:"",progress:0})}${j?`<button class=btn onclick="openBlueprint(${j.id})">⌗ Open job blueprint</button>`:""}<label class=item style="display:block"><input type=checkbox id=shareLocation> I agree to share my device location with the owner while clocked in. Sharing stops when I end the shift; the app requests updates only while this page is open.</label><div id=locationStatus class=muted>Location sharing is optional. If enabled, device/browser permissions also apply.</div><button class=btn onclick="clockStart()">▶ Start Shift</button><button class=light onclick="clockStop()">■ End Shift</button><input type=file accept=image/* capture=camera onchange="uploadPhoto(this)" class=input></div>`}
function customer(){let j=jobs[0]||{};return `<div class=card><h3>${esc(j.name||"Your Basecoat account")}</h3>${j.id?jc(j):"<p class=muted>No active jobs yet. Submit a job request and Basecoat will review it.</p>"}<p class=muted>Your project updates and invoices appear here.</p><button class=btn onclick="nav('payments')">View Invoice / Pay</button><button class=light onclick="nav('requests')">Request a Job</button></div>`}
function messages(){if(!jobs.length)return `<div class=card><h3>Messages</h3><p>No job conversations are available for this account yet.</p><p class=muted>Ask the owner to assign you to a job or link your customer account to one.</p></div>`;let j=jobs.find(x=>x.id===activeJob)||jobs[0];activeJob=j.id;return `<div class=cards><div class=card><div class=row><h3>${esc(j.name)} messages</h3><select id=msgjob onchange="selectMessageJob(this.value)">${jobs.map(x=>`<option value="${x.id}" ${x.id===activeJob?"selected":""}>${esc(x.name)}</option>`).join("")}</select><button class=light style="width:auto" onclick=loadMessages()>Refresh</button></div><div id=chatbody class=chat>Loading messages...</div><div class=row style="margin-top:10px"><input id=msg class=input placeholder="Write a message..." onkeyup="if(event.keyCode===13)sendMsg()"><button class=btn style="max-width:110px" onclick=sendMsg()>Send</button></div></div><div class=card><h3>Job conversation</h3><p>Messages are shared with the owner, assigned worker, and customer account linked to this job.</p><p class=muted>New messages refresh automatically.</p></div></div>`}
async function selectMessageJob(id){activeJob=Number(id);await loadMessages()}
async function loadMessages(){if(!activeJob||!$("#chatbody"))return;try{let d=await api("/api/messages/"+activeJob),box=$("#chatbody");if(!box)return;box.innerHTML=d.messages.map(m=>`<div class="msg ${m.sender_id===me.id?"mine":""}"><b>${esc(m.name)}</b><br>${esc(m.text)}<br><small>${new Date(m.created_at+"Z").toLocaleString()}</small></div>`).join("")||"<p class=muted>No messages yet. Start the conversation.</p>";box.scrollTop=box.scrollHeight}catch(e){$("#chatbody").textContent=e.message}}
async function sendMsg(){let box=$("#msg"),v=box?.value.trim();if(!v)return;try{await api("/api/messages/"+activeJob,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:v})});box.value="";await loadMessages()}catch(e){alert(e.message)}}
function groupsView(){return `<div class=cards><div class=card><h3>Team chats</h3><p class=muted>The company chat includes the owner and all active workers. Rank and job-site chats stay separate.</p><div id=groupList>Loading chats…</div></div><div class=card><div id=groupDetail><h3>Choose a chat</h3></div></div></div>`}
async function loadGroups(){try{let d=await api("/api/chat-groups");$("#groupList").innerHTML=d.groups.map(g=>`<button class=light onclick="openGroup(${g.id})">${g.kind==="company"?"👥":g.kind==="rank"?"☆":"⌂"} ${esc(g.name)}</button>`).join("")||"<p class=muted>No chats available.</p>";let company=d.groups.find(g=>g.kind==="company");if(company)await openGroup(company.id);else if(activeGroupId&&d.groups.some(g=>g.id===activeGroupId))await openGroup(activeGroupId);else if(d.groups.length)await openGroup(d.groups[0].id)}catch(e){$("#groupList").textContent=e.message}}
async function openGroup(id){activeGroupId=id;try{let d=await api("/api/chat-groups/"+id),g=d.group,select=d.can_manage?`<div class=toolrow><select id=addgroupworker><option value="">Add a worker…</option>${d.workers.filter(w=>!d.members.some(m=>m.id===w.id)).map(w=>`<option value="${w.id}">${esc(w.name)} · ${esc(w.rank||"Unranked")}</option>`).join("")}</select><button class=light style="width:auto" onclick="addGroupMember(${id})">Add</button></div>`:"";$("#groupDetail").innerHTML=`<h3>${esc(g.name)}</h3>${d.can_manage?"<p class=muted>You can add or remove team chat members.</p>":""}<div class=item><b>Members</b>${d.members.map(m=>`<div class=row><span>${esc(m.name)} · ${esc(m.rank||"Unranked")}</span>${d.can_manage?`<button class="light danger" style="width:auto" onclick="removeGroupMember(${id},${m.id})">Remove</button>`:""}</div>`).join("")}</div>${select}<div id=groupchat class=chat>${d.messages.map(m=>`<div class="msg ${m.sender_id===me.id?"mine":""}"><b>${esc(m.name)}</b><br>${esc(m.text)}<br><small>${new Date(m.created_at+"Z").toLocaleString()}</small></div>`).join("")||"<p class=muted>No messages yet.</p>"}</div><div class=row><input id=groupmsg class=input placeholder="Write to this group…" onkeyup="if(event.key==='Enter')sendGroupMessage(${id})"><button class=btn style="width:auto" onclick="sendGroupMessage(${id})">Send</button></div>`}catch(e){$("#groupDetail").textContent=e.message}}
async function addGroupMember(id){let user_id=Number($("#addgroupworker").value);if(!user_id)return;try{await api(`/api/chat-groups/${id}/members`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id})});await openGroup(id)}catch(e){alert(e.message)}}
async function removeGroupMember(id,uid){if(!confirm("Remove this worker from the group chat?"))return;try{await api(`/api/chat-groups/${id}/members/${uid}`,{method:"DELETE"});await openGroup(id)}catch(e){alert(e.message)}}
async function sendGroupMessage(id){let el=$("#groupmsg"),text=el?.value.trim();if(!text)return;try{await api(`/api/chat-groups/${id}/messages`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});await openGroup(id)}catch(e){alert(e.message)}}
function requestsView(){return me.role==="customer"?`<div class=card><h3>Request a Job</h3><p class=muted>Describe what you need. This is a request for review, not an accepted work order or final quote.</p><input id=reqdesc class=input placeholder="Describe the work"><input id=reqaddress class=input placeholder="Job-site address"><div class=toolrow><input id=reqdate class=input type=date><input id=reqbudget class=input type=number min=0 step=0.01 placeholder="Optional budget"><button class=btn style="width:auto" onclick=submitRequest()>Send request</button></div></div><div class=card><h3>Your requests</h3><div id=requestRows>Loading…</div></div>`:`<div class=card><h3>Requests awaiting review</h3><p class=muted>Owner and authorized foremen can accept or decline. Acceptance creates a job record for the customer.</p><div id=requestRows>Loading…</div></div>`}
async function submitRequest(){try{await api("/api/job-requests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({description:$("#reqdesc").value,address:$("#reqaddress").value,preferred_date:$("#reqdate").value,budget:$("#reqbudget").value})});$("#reqdesc").value="";$("#reqaddress").value="";await loadRequests();alert("Request sent for review.")}catch(e){alert(e.message)}}
async function loadRequests(){let d=await api("/api/job-requests");$("#requestRows").innerHTML=d.requests.map(q=>`<div class=item><b>${esc(q.description)}</b><br>${esc(q.customer_name||"Your request")} · ${esc(q.address)}<br><span class=muted>Preferred: ${esc(q.preferred_date||"Not specified")} · Budget: ${q.budget==null?"Not provided":"$"+Number(q.budget).toFixed(2)} · Status: ${esc(q.status)}</span>${q.review_note?`<p>${esc(q.review_note)}</p>`:""}${q.job_id?`<p>Job created: #${q.job_id}</p>`:""}${me.role!=="customer"&&q.status==="pending"?`<div class=toolrow><input class=input id="reqnote-${q.id}" placeholder="Review note"><button class=btn style="width:auto" onclick="openRequestPricing(${q.id},$('#reqnote-${q.id}').value)">Price and accept</button><button class="light danger" style="width:auto" onclick="reviewRequest(${q.id},'declined')">Decline</button></div>`:""}</div>`).join("")||"<p class=muted>No requests yet.</p>"}
async function reviewRequest(id,status){try{await api("/api/job-requests/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,review_note:$("#reqnote-"+id).value})});await loadRequests();await refresh()}catch(e){alert(e.message)}}
function inspectionsView(){return `<div class=card><h3>Job quality reports</h3><p class=muted>Inspectors can record a 1–5 rating, add photos, and click the saved blueprint to mark each problem location. Click the blueprint again to add more numbered pins.</p><div id=inspectionList>Loading…</div></div>`}
function openInspection(id){activeJob=id;page="inspections";render()}
async function loadInspections(){let all=me.role==="owner"||me.can_inspect?jobs:jobs.filter(j=>j.worker_id===me.id);$("#inspectionList").innerHTML=all.map(j=>`<div class=item><div class=row><b>${esc(j.name)}</b><button class=light style="width:auto" onclick="showInspection(${j.id})">View report</button></div><div id="inspection-${j.id}"></div></div>`).join("")||"<p class=muted>No jobs available.</p>";for(let j of all)await showInspection(j.id)}
let inspectionPins={};
function inspectionPinKey(id,plane){return id+":"+plane}
async function loadInspectionBlueprint(id){let plane=$("#iplane-"+id).value,box=$("#inspection-blueprint-"+id);box.innerHTML="Loading blueprint…";try{let d=await api("/api/blueprints/"+id+"?plane="+plane);if(!d.blueprint){box.innerHTML="<p class=muted>No saved "+plane.toUpperCase()+" blueprint for this job. Save one in Blueprint Studio first. Photos and notes can still be submitted.</p>";return}let key=inspectionPinKey(id,plane);inspectionPins[key]=inspectionPins[key]||[];box.innerHTML=`<div id="ipframe-${id}" style="position:relative;max-width:100%;cursor:crosshair;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden"><img src="${d.blueprint.url}" style="display:block;width:100%;height:auto"><div id="ipoverlay-${id}" style="position:absolute;inset:0"></div></div><small class=muted>Click the blueprint to place issue pins. Add notes below to describe the numbered locations.</small>`;drawInspectionPins(id,plane);$("#ipframe-"+id).onclick=e=>{let r=e.currentTarget.getBoundingClientRect();inspectionPins[key].push({x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,note:""});drawInspectionPins(id,plane)}}catch(e){box.innerHTML=`<p class=muted>${esc(e.message)}</p>`}}
function drawInspectionPins(id,plane){let box=$("#ipoverlay-"+id);if(!box)return;let pins=inspectionPins[inspectionPinKey(id,plane)]||[];box.innerHTML=pins.map((p,n)=>`<span title="Issue ${n+1}" style="position:absolute;left:${p.x*100}%;top:${p.y*100}%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#dc2626;color:white;border:2px solid white;box-shadow:0 1px 5px #333;display:flex;align-items:center;justify-content:center;font:bold 14px Arial;pointer-events:none">${n+1}</span>`).join("")}
function inspectionMarkupView(i){if(!i.blueprint_url||!i.blueprint_markers?.length)return "";return `<div class=item><b>Blueprint locations (${esc((i.blueprint_plane||"xy").toUpperCase())})</b><div style="position:relative;max-width:650px;margin-top:8px"><img src="${i.blueprint_url}" style="display:block;width:100%;height:auto;border-radius:6px">${i.blueprint_markers.map((p,n)=>`<span title="Issue ${n+1}: ${esc(p.note||"")}" style="position:absolute;left:${p.x*100}%;top:${p.y*100}%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#dc2626;color:white;border:2px solid white;display:flex;align-items:center;justify-content:center;font:bold 14px Arial">${n+1}</span>`).join("")}</div>${i.blueprint_markers.map((p,n)=>`<small class=muted>Issue ${n+1}${p.note?": "+esc(p.note):""}</small>`).join("<br>")}</div>`}
async function showInspection(id){let d=await api("/api/inspections/"+id),el=$("#inspection-"+id);if(!el)return;el.innerHTML=(d.inspections||[]).map(i=>`<div class=item><b>${"★".repeat(i.rating)}${"☆".repeat(5-i.rating)} · ${esc(i.inspector)}</b><p>${esc(i.notes)}</p>${inspectionMarkupView(i)}${i.photos?.length?`<div class=item><b>Issue photos</b><div class=toolrow>${i.photos.map(p=>`<a href="${p.url}" target=_blank><img src="${p.url}" alt="Inspection issue" style="max-width:220px;max-height:180px;border-radius:6px"></a>`).join("")}</div>${i.photos.map(p=>p.caption?`<small class=muted>${esc(p.caption)}</small>`:"").join("<br>")}</div>`:""}<small class=muted>${new Date(i.created_at+"Z").toLocaleString()}</small></div>`).join("")||"<p class=muted>No inspection reports yet.</p>";if(me.role==="owner"||me.can_inspect){el.innerHTML+=`<div class=item><h4>New inspection report</h4><div class=toolrow><select id="irating-${id}"><option value=5>5 · Excellent</option><option value=4>4 · Good</option><option value=3>3 · Needs attention</option><option value=2>2 · Poor</option><option value=1>1 · Unsatisfactory</option></select><input class=input id="inotes-${id}" placeholder="Inspection notes and overall findings"></div><label class=muted>Blueprint view to mark</label><select id="iplane-${id}" onchange="loadInspectionBlueprint(${id})"><option value=xy>Top · XY</option><option value=xz>Side · XZ</option><option value=yz>Front · YZ</option></select><div id="inspection-blueprint-${id}" style="margin:8px 0"></div><input id="ipinnote-${id}" class=input placeholder="Describe marked issue locations (optional)"><label class=muted>Attach issue photos (up to 10)</label><input id="iphotos-${id}" type=file accept="image/jpeg,image/png,image/webp,image/gif" multiple><button class=btn style="width:auto;margin-top:10px" onclick="submitInspection(${id})">Save report with photos and pins</button></div>`;loadInspectionBlueprint(id)}}
async function submitInspection(id){try{let plane=$("#iplane-"+id).value,pins=inspectionPins[inspectionPinKey(id,plane)]||[],note=$("#ipinnote-"+id).value;if(note&&pins.length)pins=pins.map(p=>({...p,note}));let d=await api("/api/inspections/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rating:$("#irating-"+id).value,notes:$("#inotes-"+id).value,blueprint_plane:plane,blueprint_markers:pins})});let files=$("#iphotos-"+id).files;if(files.length){let fd=new FormData();for(let f of files)fd.append("photos",f);await api("/api/inspections/"+id+"/"+d.id+"/photos",{method:"POST",body:fd})}inspectionPins[inspectionPinKey(id,plane)]=[];await showInspection(id)}catch(e){alert(e.message)}}
async function addBlacklist(){try{await api("/api/blacklist",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#blEmail").value,reason:$("#blReason").value})});$("#blEmail").value="";$("#blReason").value="";await loadBlacklist()}catch(e){alert(e.message)}}
async function loadBlacklist(){let d=await api("/api/blacklist");$("#blacklistRows").innerHTML=d.entries.map(x=>`<div class=item><b>${esc(x.customer_name)} · ${esc(x.customer_email)}</b><br>${esc(x.reason)}<br><button class=light style="width:auto" onclick="removeBlacklist(${x.id})">Remove block</button></div>`).join("")||"<p class=muted>No blocked request accounts.</p>"}
async function removeBlacklist(id){await api("/api/blacklist/"+id,{method:"DELETE"});await loadBlacklist()}
function termsView(){return `<div class=card><h3>Basecoat Service Terms · Draft</h3><p class=muted><b>Draft for review only.</b> Add your company identity, license details, service area, required state and local notices, and have a construction attorney review it before customers sign.</p><h4>Work and changes</h4><p>The signed proposal, plans, and approved written change orders define the work. Changes to scope, materials, price, or schedule require written approval before the added work begins, except emergency steps permitted by law.</p><h4>Price and payment</h4><p>Customer pays the amounts and milestones stated in the signed proposal and approved change orders. Invoices identify the amount due and due date. Payment methods and any lawful fees must be stated in the signed documents and allowed by applicable law.</p><h4>Late payment and work pause</h4><p>If an undisputed amount is overdue, Basecoat may give written notice and a reasonable opportunity to cure, then pause work to the extent the contract and applicable law permit. Basecoat may pursue lawful collection, dispute resolution, or a construction lien only when legally available and within required deadlines. No term authorizes trespass, unsafe entry, or damaging or destroying installed work. Removal of unpaid materials is limited to items that remain legally removable and can be retrieved safely with lawful access.</p><h4>Site access and responsibility</h4><p>Customer will provide agreed access and disclose known hazards. Each party remains responsible for its own conduct to the extent required by law. Nothing here releases Basecoat from responsibility for damage caused by its negligence or intentional misconduct, or waives rights that cannot legally be waived.</p><h4>Requests and acceptance</h4><p>A submitted job request is not an accepted contract. Work starts only after Basecoat accepts the request and both sides sign the required proposal or home-improvement contract. The signed documents will state cancellation rights, notices, payment schedule, warranty, and any required license or lien information.</p><h4>Customer records and project images</h4><p>Project photos, messages, and plans are used to manage the requested work. Obtain appropriate customer consent before using identifiable photos for advertising or public display.</p><h4>Governing law and mandatory rights</h4><p>The work-site jurisdiction governs where applicable, subject to mandatory consumer and construction laws. Any required cancellation, warranty, licensing, escrow, bond, lien, or consumer-protection rights control over inconsistent language.</p><hr><p class=muted>Michigan review: this is not a Michigan-approved contract. The <a href="https://www.michigan.gov/consumerprotection/protect-yourself/consumer-alerts/home-health/building-and-remodeling-advice-for-homeowners" target="_blank" rel="noopener">Michigan Attorney General</a> recommends a signed written contract with the work, costs, dates, and contractor information. Cancellation rights vary by transaction; check the state rules and add the notices required for this job before use.</p></div>`}
function payments(){return `<div class=card><h3>${me.role==="customer"?"Your invoices and payment requests":"Job invoices and payment status"}</h3><p class=muted>${me.role==="customer"?"When a completed job's final balance is requested, it appears here.":"Mark a job complete, then request its remaining invoice balance from the job card."} Customers can pay through secure Stripe Checkout once it is configured.</p><div id=invoiceList>Loading invoices…</div></div>`}
function invoiceRow(i){let due=Math.max(0,Number(i.total||0)-Number(i.paid||0)),button="";if(me.role==="owner"&&String(i.job_status).toLowerCase()==="complete"&&due>0&&i.status!=="Payment Requested")button='<button class=light onclick="requestPayment('+i.job_id+')">Request final payment</button>';if(me.role==="customer"&&i.status==="Payment Requested"&&due>0){if(paymentConfig.stripe_enabled)button='<button class=btn onclick="pay('+i.job_id+')">Pay balance $'+due.toFixed(2)+'</button>';else if(paymentConfig.demo_mode)button='<button class=btn onclick="pay('+i.job_id+')">Record demo payment $'+due.toFixed(2)+'</button>';else button='<p class=muted>Online payment is being set up. Contact Basecoat to arrange payment.</p>'}let requested=i.payment_requested_at?" · Requested "+new Date(i.payment_requested_at+"Z").toLocaleString():"";return '<div class=item><b>'+esc(i.job_name)+'</b> · '+esc(i.job_status)+'<br>Invoice total $'+Number(i.total).toFixed(2)+' · Paid $'+Number(i.paid||0).toFixed(2)+' · Balance $'+due.toFixed(2)+'<br><span class=muted>'+esc(i.status)+requested+'</span>'+button+'</div>'}
async function loadInvoices(){let [d,p]=await Promise.all([api("/api/invoices"),api("/api/payment-config")]);paymentConfig=p;let rows=d.invoices||[],sum=rows.reduce((a,x)=>a+Math.max(0,Number(x.total||0)-Number(x.paid||0)),0);$("#invoiceList").innerHTML='<div class=item><b>Open balance: $'+sum.toFixed(2)+'</b></div>'+(rows.map(invoiceRow).join("")||"<p class=muted>No invoices yet.</p>")}
async function requestPayment(id){if(!confirm("Request the remaining invoice balance from the customer? They will see the request in Payments."))return;try{await api("/api/invoices/"+id+"/request-payment",{method:"POST"});await refresh();await loadInvoices();alert("Payment requested. The customer can see it in their Payments page.")}catch(e){alert(e.message)}}
async function pay(id){try{if(paymentConfig.stripe_enabled){let d=await api("/api/payments/checkout/"+id,{method:"POST"});location.href=d.url;return}if(!paymentConfig.demo_mode){alert("Online card payments are not configured yet. Contact Basecoat to arrange payment.");return}if(!confirm("This demo records a payment but does not charge a card. Continue?"))return;let d=await api("/api/payments/demo/"+id,{method:"POST"});alert("Demo payment recorded: $"+d.paid);await loadInvoices();await refresh()}catch(e){alert(e.message)}}
function priceView(){return `<div class=card><div class=row><div><h3>Price a Job</h3><p class=muted>Suggested customer price = drywall + estimated worker pay + other job costs + planned profit. The planned profit floor is at least $500. The chosen work type estimates hours per sheet; use an average hourly rate if crew members have different pay.</p></div>${me.role==="owner"?`<button class=light style="width:auto" onclick="nav('pricing-settings')">Edit pricing defaults</button>`:""}</div><div class=grid><div><label>Job name</label><input id=priceName class=input placeholder="Job name"></div><div><label>Work type</label><select id=priceType class=input onchange="updatePriceEstimate(true)"></select></div><div><label>Job-site address</label><input id=priceAddress class=input placeholder="Address"></div><div><label>Customer email (optional)</label><input id=priceCustomer class=input placeholder="Customer account email"></div><div><label>Assigned worker</label><select id=priceWorker class=input onchange=setRateFromWorker><option value="">Unassigned</option></select></div><div><label>Drywall sheets</label><input id=priceSheets class=input type=number min=0 step=1 value=0 oninput="updatePriceEstimate()"></div><div><label>Crew size</label><input id=priceCrew class=input type=number min=1 step=1 value=1 oninput="updatePriceEstimate()"></div><div><label>Hourly pay per worker</label><input id=priceRate class=input type=number min=0 step=0.01 oninput="updatePriceEstimate()"></div><div><label>Estimated hours per worker</label><input id=priceHours class=input type=number min=0 step=0.25 oninput="priceHoursTouched=true;updatePriceEstimate()"></div><div><label>Drywall material cost per sheet</label><input id=priceSheetCost class=input type=number min=0 step=0.01 oninput="updatePriceEstimate()"></div><div><label>Other job costs</label><input id=priceOther class=input type=number min=0 step=0.01 oninput="updatePriceEstimate()"></div><div><label>Planned profit (minimum $500)</label><input id=priceProfit class=input type=number min=500 step=1 oninput="updatePriceEstimate()"></div><div><label>Customer price</label><input id=priceQuote class=input type=number min=0 step=0.01 oninput="priceQuoteTouched=true;updatePriceEstimate()"></div></div><div id=priceBreakdown class=item>Enter job details to calculate the price.</div><button class=light style="width:auto" onclick="useSuggestedPrice()">Use suggested price</button><button class=btn onclick="savePricedJob()">Save price and job</button><button class=light onclick="nav('jobs')">Cancel</button></div>`}

function drawShape(a,b,kind){ct.strokeStyle=bpColor;ct.lineWidth=kind==="wall"?Math.max(5,bpWidth*2):bpWidth;ct.beginPath();if(kind==="rect"){ct.rect(a.x,a.y,b.x-a.x,b.y-a.y);ct.stroke();let l={x:Math.min(a.x,b.x),y:Math.min(a.y,b.y)},r={x:Math.max(a.x,b.x),y:Math.max(a.y,b.y)},p=[l,{x:r.x,y:l.y},r,{x:l.x,y:r.y}];drawDimension(p[0],p[1],0,-1);drawDimension(p[1],p[2],1,0);drawDimension(p[2],p[3],0,1);drawDimension(p[3],p[0],-1,0);return}if(kind==="square"){let side=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y)),x=b.x<a.x?a.x-side:a.x,y=b.y<a.y?a.y-side:a.y;ct.rect(x,y,side,side);ct.stroke();let p=[{x,y},{x:x+side,y},{x:x+side,y:y+side},{x,y:y+side}];drawDimension(p[0],p[1],0,-1);drawDimension(p[1],p[2],1,0);drawDimension(p[2],p[3],0,1);drawDimension(p[3],p[0],-1,0);return}if(kind==="circle"){let side=Math.min(Math.abs(b.x-a.x),Math.abs(b.y-a.y)),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,r=side/2;ct.arc(cx,cy,r,0,Math.PI*2);ct.stroke();drawDimension({x:cx-r,y:cy},{x:cx+r,y:cy},0,-1,"Ø "+formatLength(side/bpScale));return}ct.moveTo(a.x,a.y);ct.lineTo(b.x,b.y);ct.stroke();let len=Math.hypot(b.x-a.x,b.y-a.y)||1;drawDimension(a,b,(b.y-a.y)/len,-(b.x-a.x)/len)}
function drawDimension(a,b,nx,ny,label=null){if(!bpScale)return;let offset=22,aa={x:a.x+nx*offset,y:a.y+ny*offset},bb={x:b.x+nx*offset,y:b.y+ny*offset};ct.save();ct.strokeStyle="#d66b25";ct.fillStyle="#fff";ct.lineWidth=1.5;ct.setLineDash([5,4]);ct.beginPath();ct.moveTo(a.x,a.y);ct.lineTo(aa.x,aa.y);ct.moveTo(b.x,b.y);ct.lineTo(bb.x,bb.y);ct.moveTo(aa.x,aa.y);ct.lineTo(bb.x,bb.y);ct.stroke();ct.setLineDash([]);for(let p of [aa,bb]){ct.beginPath();ct.arc(p.x,p.y,6,0,Math.PI*2);ct.fill();ct.stroke()}let txt=label||formatLength(Math.hypot(b.x-a.x,b.y-a.y)/bpScale);ct.font="bold 12px Arial";let w=ct.measureText(txt).width+12,mx=(aa.x+bb.x)/2,my=(aa.y+bb.y)/2;ct.fillStyle="#fff";ct.fillRect(mx-w/2,my-10,w,20);ct.strokeStyle="#d66b25";ct.strokeRect(mx-w/2,my-10,w,20);ct.fillStyle="#7a3510";ct.textAlign="center";ct.textBaseline="middle";ct.fillText(txt,mx,my);ct.restore()}
function drawPathLength(points){if(points.length<2)return;let total=0;for(let i=1;i<points.length;i++)total+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);let a=points[0],b=points[points.length-1],len=Math.hypot(b.x-a.x,b.y-a.y)||1;drawDimension(a,b,(b.y-a.y)/len,-(b.x-a.x)/len,"Path "+formatLength(total/bpScale))}
function drawPolygon(close=false,preview=null){if(!polyPoints.length)return;if(polyBase)ct.putImageData(polyBase,0,0);ct.strokeStyle=bpColor;ct.fillStyle=bpColor;ct.lineWidth=bpWidth;ct.beginPath();ct.moveTo(polyPoints[0].x,polyPoints[0].y);for(let i=1;i<polyPoints.length;i++)ct.lineTo(polyPoints[i].x,polyPoints[i].y);if(preview)ct.lineTo(preview.x,preview.y);if(close)ct.closePath();ct.stroke();if(!close){ct.fillStyle="#d66b25";for(let p of polyPoints){ct.beginPath();ct.arc(p.x,p.y,4,0,Math.PI*2);ct.fill()}let start=polyPoints[0];ct.beginPath();ct.arc(start.x,start.y,9,0,Math.PI*2);ct.strokeStyle="#1f8a5b";ct.lineWidth=2;ct.stroke()}}
function finishPolygon(){if(polyPoints.length<3){alert("Click at least 3 points to make a shape.");return}let p=[...polyPoints],area=0;for(let i=0;i<p.length;i++){let a=p[i],b=p[(i+1)%p.length];area+=a.x*b.y-b.x*a.y}let direction=area>=0?1:-1;drawPolygon(true);for(let i=0;i<p.length;i++){let a=p[i],b=p[(i+1)%p.length],len=Math.hypot(b.x-a.x,b.y-a.y)||1;drawDimension(a,b,direction*(b.y-a.y)/len,-direction*(b.x-a.x)/len)}polyPoints=[];polyBase=null;$("#bpstatus").textContent="Outline closed and shape added with a measured label on every side."}
function drawSymbol(a,b,kind){ct.strokeStyle=bpColor;ct.fillStyle=bpColor;ct.lineWidth=bpWidth;ct.beginPath();ct.moveTo(a.x,a.y);ct.lineTo(b.x,b.y);ct.stroke();let len=Math.hypot(b.x-a.x,b.y-a.y)||1,nx=(b.y-a.y)/len,ny=-(b.x-a.x)/len;if(kind==="door"){ct.beginPath();ct.arc(a.x,a.y,len,0,Math.PI/2);ct.stroke();drawDimension(a,b,nx,ny)}if(kind==="window"){ct.beginPath();ct.moveTo(a.x+5,a.y+5);ct.lineTo(b.x+5,b.y+5);ct.stroke();drawDimension(a,b,nx,ny)}}
function setTool(t){if(bpTool==="points"&&t!=="points"&&polyPoints.length>=3)finishPolygon();else if(t!=="points"&&polyPoints.length){ct.putImageData(polyBase,0,0);polyPoints=[];polyBase=null;undoStack.pop()}bpTool=t;document.querySelectorAll(".tools button").forEach(b=>b.classList.toggle("selected",b.dataset.tool===t))}
function clearBP(){if(!ct)return;if(polyPoints.length){polyPoints=[];polyBase=null;undoStack.pop()}snapshot();ct.clearRect(0,0,cv.width,cv.height);grid()}
function undoBP(){if(polyPoints.length){ct.putImageData(polyBase,0,0);polyPoints=[];polyBase=null;undoStack.pop();return}if(!undoStack.length)return;redoStack.push(ct.getImageData(0,0,cv.width,cv.height));ct.putImageData(undoStack.pop(),0,0)}function redoBP(){if(!redoStack.length)return;undoStack.push(ct.getImageData(0,0,cv.width,cv.height));ct.putImageData(redoStack.pop(),0,0)}function exportBP(){if(!cv)return;let a=document.createElement("a");a.download="basecoat-job-"+activeJob+"-blueprint.png";a.href=cv.toDataURL("image/png");a.click()}
document.addEventListener("keydown",e=>{if(page!=="blueprint"||!cv||!(e.ctrlKey||e.metaKey))return;let tag=(document.activeElement?.tagName||"").toLowerCase();if(["input","textarea","select"].includes(tag)||document.activeElement?.isContentEditable)return;let k=e.key.toLowerCase();if(k==="z"&&!e.shiftKey){e.preventDefault();undoBP()}else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redoBP()}});
async function saveBP(show=true){if(!activeJob){if(show)alert("Choose a job first.");return}try{let d=await api("/api/blueprints/"+activeJob,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({png:cv.toDataURL("image/png"),plane:bpPlane,scale:bpScale,units:bpUnits,origin_x:bpOrigin.x,origin_y:bpOrigin.y,canvas_width:cv.clientWidth,canvas_height:cv.clientHeight})});if(bpPlane==="xy"){let job=jobs.find(j=>j.id===activeJob);if(job)job.blueprint_url=d.url}$("#bpstatus").textContent="Saved "+bpPlane.toUpperCase()+" view to this job at "+new Date(d.updated_at).toLocaleString();if(show)alert("Blueprint saved to this job")}catch(e){if(show)alert(e.message)}}
async function sendBP(){await saveBP(false);alert("Saved blueprint is available to the crew on this job.")}
async function uploadPhoto(input){if(!input.files[0])return;let fd=new FormData();fd.append("photo",input.files[0]);let d=await api("/api/photos/"+activeJob,{method:"POST",body:fd});alert("Photo uploaded");}
async function clockStart(){try{if(!activeJob)throw Error("There is no assigned job to clock into.");if($("#shareLocation")?.checked&&!navigator.geolocation)throw Error("This browser does not provide location access.");await api("/api/time/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:activeJob})});if($("#shareLocation")?.checked)startLocationSharing();else if($("#locationStatus"))$("#locationStatus").textContent="Clocked in. Location sharing is off.";alert("Clocked in") }catch(e){alert(e.message)}}
function sendWorkerLocation(position){let now=Date.now();if(now-lastLocationSent<25000)return;lastLocationSent=now;api("/api/locations/current",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lat:position.coords.latitude,lon:position.coords.longitude,accuracy:position.coords.accuracy})}).then(()=>{if($("#locationStatus"))$("#locationStatus").textContent="Location sharing is on during this shift. Last update: "+new Date().toLocaleTimeString()}).catch(e=>{if($("#locationStatus"))$("#locationStatus").textContent=e.message})}
function startLocationSharing(){if(!navigator.geolocation||locationWatch!==null||document.hidden)return;sharingRequested=true;locationWatch=navigator.geolocation.watchPosition(sendWorkerLocation,e=>{if($("#locationStatus"))$("#locationStatus").textContent="Location unavailable: "+e.message},{enableHighAccuracy:true,maximumAge:15000,timeout:20000})}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&locationWatch!==null){navigator.geolocation.clearWatch(locationWatch);locationWatch=null}else if(!document.hidden&&sharingRequested&&locationWatch===null)startLocationSharing()});
async function clockStop(){try{sharingRequested=false;if(locationWatch!==null){navigator.geolocation.clearWatch(locationWatch);locationWatch=null}await api("/api/locations/current",{method:"DELETE"});await api("/api/time/stop",{method:"POST"});if($("#locationStatus"))$("#locationStatus").textContent="Clocked out. Location sharing has stopped.";alert("Clocked out")}catch(e){alert(e.message)}}
function setJobBoundary(id){if(!navigator.geolocation){alert("This browser does not provide location access.");return}let ft=Number(prompt("Boundary radius in feet (default 500):","500"));if(!Number.isFinite(ft)||ft<=0){alert("Enter a radius in feet.");return}navigator.geolocation.getCurrentPosition(async p=>{try{await api(`/api/jobs/${id}/geofence`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({lat:p.coords.latitude,lon:p.coords.longitude,radius_m:ft*0.3048})});alert("Site boundary saved. Set it while you are at the job site.")}catch(e){alert(e.message)}},e=>alert("Could not get your site location: "+e.message),{enableHighAccuracy:true,timeout:15000})}
async function loadTracking(){try{let d=await api("/api/locations");$("#trackingRows").innerHTML=d.workers.map(w=>{let status=w.lat===null?"No location shared":w.stale?"Location is stale":w.inside_site===null?"Site boundary not set":w.inside_site?"Within site boundary":"OUTSIDE site boundary";let color=status.startsWith("OUTSIDE")?"#b91c1c":w.stale?"#9a6700":"#16794b";let map=w.lat===null?"":` · <a target=_blank rel=noopener href="https://www.google.com/maps?q=${w.lat},${w.lon}">Open map</a>`;return `<div class=item><b>${esc(w.worker)}</b> · ${esc(w.job)}<br>${esc(w.address||"")}<br><b style="color:${color}">${status}</b>${w.distance_m!==null?` · ${Math.round(w.distance_m)} m from site center (radius ${Math.round(w.geofence_radius_m)} m)`:""}${w.updated_at?` · Updated ${new Date(w.updated_at+"Z").toLocaleString()}`:""}${map}</div>`}).join("")||"<p class=muted>No one is currently clocked in.</p>"}catch(e){$("#trackingRows").textContent=e.message}}
async function logout(){if(msgTimer){clearInterval(msgTimer);msgTimer=null}await api("/api/logout",{method:"POST"});me=null;login()}
async function postRender(){if(page==="blueprint")setup();if(page==="accounts")await loadAccounts();if(page==="tracking"){await loadTracking();msgTimer=setInterval(()=>{if(page==="tracking")loadTracking()},15000)}if(page==="password"){}if(page==="workers"){let [d,r]=await Promise.all([api("/api/workers"),api("/api/ranks")]);$("#workers").innerHTML=d.workers.map(x=>`<div class=item><div class=row><div><b>${esc(x.name)}</b> · ${esc(x.email)}<br><span class=muted>${esc(x.employment_status)} · ${esc(x.rank||"Unranked")} · ${Number(x.rate).toFixed(2)}/hr</span></div><div class=toolrow><select id="worker-rank-${x.id}"><option value="">Unranked</option>${r.ranks.map(z=>`<option value="${z.id}" ${z.id===x.rank_id?"selected":""}>${esc(z.name)}</option>`).join("")}</select><button class=light style="width:auto" onclick="saveWorkerRank(${x.id})">Save rank</button><button class=btn style="width:auto" onclick="openPayroll(${x.id})">Manage pay</button><button class="light ${x.employment_status==="active"?"danger":""}" style="width:auto" onclick="changeWorkerStatus(${x.id},'${x.employment_status==="active"?"fired":"active"}')">${x.employment_status==="active"?"Fire worker":"Reactivate"}</button></div></div></div>`).join("")||"<p class=muted>No worker accounts.</p>"}if(page==="ranks")await loadRanksPage();if(page==="payroll")await loadPayroll();if(page==="customers"){let d=await api("/api/customers");$("#customers").innerHTML=d.customers.map(x=>`<div class=item><b>${esc(x.name)}</b> · ${esc(x.email)}</div>`).join("")}if(page==="messages"){await loadMessages();msgTimer=setInterval(loadMessages,5000)}if(page==="groups"){await loadGroups();msgTimer=setInterval(()=>{if(page==="groups"&&activeGroupId)openGroup(activeGroupId)},5000)}if(page==="requests")await loadRequests();if(page==="blacklist")await loadBlacklist();if(page==="inspections")await loadInspections();if(page==="price")await loadPriceForm();if(page==="pricing-settings")await loadPricingSettings();if(page==="payments")await loadInvoices()}
function render(){if(msgTimer){clearInterval(msgTimer);msgTimer=null}if(!me){login();return}root.innerHTML=shell();postRender()}
(async()=>{try{let d=await api("/api/me");if(d.authenticated){me=d;if(me.role==="worker"&&me.approval_status!=="approved"){render();return}await refresh();page=me.role==="customer"?"home":me.role==="worker"?"home":"dashboard";render()}else login()}catch(e){login()}})();
</script></body></html>
